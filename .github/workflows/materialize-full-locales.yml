name: Materialize full locale catalogs

on:
  push:
    branches: [fix/full-zh-ja-locales]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode complete catalogs
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .locale-bundle/zh.json.gz.b64 | gzip -d > messages/zh.json
          base64 -d .locale-bundle/ja.json.gz.b64 | gzip -d > messages/ja.json
          echo "d5b0fa5c11e8e605ac3117969c2f3efd36082dd8618b9623a32ee29f6143486e  messages/zh.json" | sha256sum -c -
          echo "c0c675ade7c91bf17b61794728ebf4ff73a47e09340daf377c5cceec1bc55040  messages/ja.json" | sha256sum -c -

      - name: Validate and simplify locale implementation
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          import shutil

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def placeholders(value):
              if not isinstance(value, str):
                  return []
              return sorted(re.findall(r"\{[^{}]+\}", value))

          source = load("messages/en.json")
          source_keys = list(source)
          if len(source_keys) != 899:
              raise SystemExit(f"Unexpected English key count: {len(source_keys)}")

          for locale in ("zh", "ja"):
              target = load(f"messages/{locale}.json")
              target_keys = list(target)
              if target_keys != source_keys:
                  missing = [key for key in source_keys if key not in target]
                  extra = [key for key in target_keys if key not in source]
                  raise SystemExit(
                      f"{locale}: key mismatch; missing={missing}, extra={extra}"
                  )
              for key in source_keys:
                  expected = placeholders(source[key])
                  actual = placeholders(target[key])
                  if expected != actual:
                      raise SystemExit(
                          f"{locale}: placeholder mismatch for {key}: "
                          f"{expected} != {actual}"
                      )
              print(f"{locale}: {len(target_keys)} keys, placeholders valid")

          package_path = Path("package.json")
          package = load(package_path)
          scripts = package["scripts"]
          scripts.pop("i18n:generate", None)
          scripts.pop("predev", None)
          scripts["prebuild"] = "node scripts/db-setup.mjs"
          scripts["precf:build"] = "node scripts/db-setup.mjs"
          scripts["postinstall"] = (
              "mkdir -p data && (test -f src/config/db/schema.ts || "
              "node scripts/db-setup.mjs)"
          )
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          gitignore_path = Path(".gitignore")
          gitignore = gitignore_path.read_text(encoding="utf-8")
          gitignore = gitignore.replace(
              "# generated locale catalogs (source translations live in messages/overrides/)\n"
              "/messages/zh.json\n/messages/ja.json\n\n",
              "",
          )
          gitignore_path.write_text(gitignore, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old = (
              "中文和日文翻译维护在 `messages/overrides/`。运行 `pnpm i18n:generate` "
              "会以完整的 `messages/en.json` 为基准生成 `messages/zh.json` 和 "
              "`messages/ja.json`，并校验 key、顺序与 `{placeholder}`，避免语言文件截断或漏字段。"
          )
          new = (
              "中文和日文均使用直接提交的完整语言文件：`messages/zh.json` 与 "
              "`messages/ja.json`。两份文件均与英文基准保持 899 个 key 和一致的 "
              "`{placeholder}`。"
          )
          if old not in readme:
              raise SystemExit("README locale paragraph was not found")
          readme_path.write_text(readme.replace(old, new), encoding="utf-8")

          vite_path = Path("vite.config.ts")
          vite = vite_path.read_text(encoding="utf-8")
          replacements = {
              "// API stays unprefixed for both locales.":
                  "// API stays unprefixed for every locale.",
              "// baseLocale (ko) has no prefix; English lives under /en.":
                  "// baseLocale (ko) has no prefix; other locales use URL prefixes.",
              "// otherwise /en/* is swallowed as a Korean path and 404s.":
                  "// otherwise localized paths are swallowed as Korean paths and 404.",
              "            ['ko', '/api/:path(.*)?'],\n"
              "            ['en', '/api/:path(.*)?'],":
                  "            ['ko', '/api/:path(.*)?'],\n"
                  "            ['en', '/api/:path(.*)?'],\n"
                  "            ['zh', '/api/:path(.*)?'],\n"
                  "            ['ja', '/api/:path(.*)?'],",
              "            ['en', '/en'],\n"
              "            ['ko', '/'],":
                  "            ['en', '/en'],\n"
                  "            ['zh', '/zh'],\n"
                  "            ['ja', '/ja'],\n"
                  "            ['ko', '/'],",
              "            ['en', '/en/:path(.*)?'],\n"
              "            ['ko', '/:path(.*)?'],":
                  "            ['en', '/en/:path(.*)?'],\n"
                  "            ['zh', '/zh/:path(.*)?'],\n"
                  "            ['ja', '/ja/:path(.*)?'],\n"
                  "            ['ko', '/:path(.*)?'],",
          }
          for old_text, new_text in replacements.items():
              if old_text not in vite:
                  raise SystemExit(f"vite.config.ts fragment not found: {old_text}")
              vite = vite.replace(old_text, new_text, 1)
          vite_path.write_text(vite, encoding="utf-8")

          shutil.rmtree("messages/overrides")
          Path("scripts/generate-locales.mjs").unlink()
          shutil.rmtree(".locale-bundle")
          Path(".github/workflows/materialize-full-locales.yml").unlink()

      - name: Commit direct locale files and routing fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use full Chinese and Japanese locale files"
          git push
